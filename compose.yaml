services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-55433}:5432"
    volumes:
      - billing_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 5s
      timeout: 5s
      retries: 20

  dispute-service:
    build:
      context: .
      dockerfile: dispute-service/Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-18081}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://db:5432/billing
      DB_USER: billing
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Generate a local shared API key in .env}
      REPORTING_BASE_URL: http://reporting-service:8081
      COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy

  reporting-service:
    build:
      context: .
      dockerfile: reporting-service/Dockerfile
    ports:
      - "127.0.0.1:${REPORT_PORT:-18082}:8081"
    environment:
      PORT: "8081"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Generate a local shared API key in .env}
      DISPUTE_BASE_URL: http://dispute-service:8080
      API_DOCS_ENABLED: "true"
    depends_on:
      dispute-service:
        condition: service_healthy

volumes:
  billing_data:
