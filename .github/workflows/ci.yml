name: Build and verify
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Unit, PostgreSQL integration tests and JaCoCo
        run: mvn -B -f backend/pom.xml clean verify
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
      - name: Start packaged application
        run: |
          cp .env.example .env
          docker compose up --build -d --wait --wait-timeout 240
      - name: Browser smoke tests
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - name: Container logs
        if: always()
        run: docker compose logs --no-color > compose-test.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
            backend/target/site/jacoco
            backend/target/evaluation
            e2e/test-results
            e2e/playwright-report
            compose-test.log
      - name: Stop containers
        if: always()
        run: docker compose down
