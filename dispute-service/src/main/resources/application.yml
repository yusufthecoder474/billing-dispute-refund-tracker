spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/billing}
    username: ${DB_USER:billing}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    csrf:
      enabled: true

# Fail closed: the protected export returns 401 if this key is unset.
billing:
  internal-api-key: ${INTERNAL_API_KEY:}
reporting:
  base-url: ${REPORTING_BASE_URL:http://127.0.0.1:8081}
